<!doctype html>
<html lang="en" data-theme="system"><head><meta charset="utf-8"><title>Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{--page:#fafafa;--card:#fff;--raised:#fff;--line:#e4e4e4;--text:#0a0a0a;--mute:#666;--ink:#0a0a0a;--on-ink:#fff;--accent:#0a0a0a;--on-accent:#fff;--accent-soft:#0a0a0a0f;--bubble:#ededed;--field:#f1f1f1;--ok:#157a42;--warn:#8a5d00;--bad:#b8291f;--code:#f4f4f4;--scrim:rgba(10,10,10,.32);--shadow:0 0 0 1px var(--line);--shadow-raised:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.08)}
html[data-resolved=dark]{--page:#000;--card:#111;--raised:#1a1a1a;--line:#262626;--text:#ededed;--mute:#8f8f8f;--ink:#ededed;--on-ink:#0a0a0a;--accent:#ededed;--on-accent:#0a0a0a;--accent-soft:#ededed1a;--bubble:#1c1c1c;--field:#1a1a1a;--ok:#43c076;--warn:#e2a826;--bad:#ff6b63;--code:#0a0a0a;--scrim:rgba(0,0,0,.56);--shadow:none;--shadow-raised:0 0 0 1px var(--line)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
/* The app passes the bar sizes in (--sat, --sab ...); each .view keeps clear of them, the page colour still fills them. */
body{background:var(--page);color:var(--text);font:16px/1.45 "Inter","Space Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{padding:0 var(--sar,0px) var(--sab,0px) var(--sal,0px);position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--page);overflow:hidden}
@media (min-width:520px){#app{height:min(100dvh - 32px,920px);margin:16px auto;border-radius:34px;box-shadow:0 0 0 1px var(--line)}}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:var(--sat,0px) 0 0 0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 8px}
.top h1{font-size:34px;line-height:1.1;margin:0;letter-spacing:-.02em}
#chatMenu{position:absolute;right:14px;top:calc(max(28px,env(safe-area-inset-top)) + 50px);z-index:20;min-width:230px;max-width:calc(100% - 28px);background:var(--raised);color:var(--text);border-radius:18px;box-shadow:var(--shadow-raised);padding:12px;display:flex;flex-direction:column;gap:6px}
#chatMenu[hidden]{display:none}
html[data-resolved=dark] #chatMenu{border:1px solid var(--line)}
#chatMenu .menulabel{font-size:12px;color:var(--mute);padding:0 4px}
#chatMenu select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text)}
#chatMenu .menusep{height:1px;background:var(--line);margin:4px 0}
#chatMenu .menuitem{background:none;border:0;text-align:left;font:inherit;padding:10px 6px;border-radius:10px;color:var(--text)}
#chatMenu .menuitem:active{background:var(--field)}
.iconbtn{background:none;border:0;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;position:relative}
@media (hover:hover){.iconbtn:hover{background:var(--field)}}
.iconbtn:active{background:var(--field)}
.badge{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--page)}
.scroll{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}
/* cards */
.card{background:var(--card);border-radius:22px;padding:16px 18px;margin:0 0 12px;box-shadow:var(--shadow)}
html[data-resolved=dark] .card{border:1px solid var(--line)}
.card h3{margin:0;font-size:16px;font-weight:600}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cardhead .grow{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:14px;display:inline-flex;align-items:center;gap:2px;padding:4px 0}
.date{font-size:13px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin:6px 4px 0}
.greet{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 4px 4px;line-height:1.15}
.lead{font-size:18px;margin:0 4px 16px;color:var(--text)}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.sub{color:var(--mute);font-size:15px}
.overview{display:flex;align-items:center;justify-content:space-between}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:19px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-of-type{border-top:0}
.chip{width:36px;height:36px;border-radius:10px;background:var(--field);display:grid;place-items:center;flex:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:500}
.empty{color:var(--mute);padding:6px 0}
.pill{border-radius:999px;border:1px solid var(--line);background:var(--field);padding:8px 14px;font-size:14px}
.pill.solid{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* tabs */
#tabs{display:flex;background:var(--card);border-radius:30px;margin:0 16px 14px;padding:6px 8px;box-shadow:0 0 0 1px var(--line)}
#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:12px}
#tabs button[aria-current=page]{color:var(--text);font-weight:700}
#tabs button[aria-current=page] svg{stroke-width:2.4}
/* chat */
#chatScroll{flex:1;min-height:0;overflow:auto;padding:0 18px}
#log{display:flex;flex-direction:column;gap:12px;padding:6px 0 18px}
#hello{padding:7vh 6px 0;text-align:center}
#hello h2{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
#hello p{color:var(--mute);margin:0 0 18px}
.starts{display:flex;flex-direction:column;gap:8px}
.start{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
body.has-chat #hello{display:none}
.me{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-radius:20px 20px 6px 20px;padding:10px 16px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.mewrap{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end}.mewrap .me{max-width:100%}
.meta{font-size:12px;color:var(--mute);margin:3px 6px 0}
.me,.bot{cursor:pointer}
.msgwrap{align-self:flex-start;max-width:88%}
.bot{background:var(--bubble);border-radius:20px 20px 20px 6px;padding:10px 16px;word-break:break-word;align-self:flex-start;max-width:88%}
.msgwrap .bot{max-width:100%}
.bot>div>:last-child{margin-bottom:0}
.bot p{margin:0 0 8px}.bot ul,.bot ol{margin:0 0 8px;padding-left:20px}.bot h3,.bot h4{margin:10px 0 4px}
.bot a{color:inherit;text-decoration:underline}
.bot code{background:var(--code);border-radius:6px;padding:1px 5px;font:13px ui-monospace,Menlo,monospace}
.bot pre{background:var(--code);border-radius:12px;padding:10px;overflow:auto;margin:0 0 8px}
.bot pre code{background:none;padding:0}
.acts{display:flex;gap:2px;margin-top:2px;opacity:0;transition:opacity .15s}
@media (hover:hover){.msgwrap:hover .acts{opacity:1}}
.acts:focus-within{opacity:1}
.acts button{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 8px;border-radius:8px}
.sys{color:var(--mute);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.typing{display:inline-flex;gap:5px;padding:12px 16px;background:var(--bubble);border-radius:20px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
@media (prefers-reduced-motion:no-preference){.typing i{animation:bounce 1.2s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,80%,100%{opacity:.25}40%{opacity:1}}}
.turn{border:1px solid var(--line);border-radius:14px;background:var(--card);max-width:100%;align-self:stretch}
.turn>summary{cursor:pointer;padding:7px 12px;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px;list-style:none}
.turn>summary::-webkit-details-marker{display:none}
.turn>summary::before{content:"\25B8"}.turn[open]>summary::before{content:"\25BE"}
.turn .st{font-family:ui-monospace,Menlo,monospace}
.turn.running .st{color:var(--text)}.turn.done .st{color:var(--ok)}.turn.error .st,.turn.cancelled .st{color:var(--warn)}
.steps{padding:4px 12px 10px;display:grid;gap:6px;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:12px}
.step .t{color:var(--mute);font-family:ui-monospace,Menlo,monospace}.step .k{font-weight:600}
.step pre{margin:4px 0 0;background:var(--code);border-radius:8px;padding:6px 8px;overflow:auto;max-height:160px;font-size:11px;white-space:pre-wrap;word-break:break-word}
.step.bad .k{color:var(--warn)}.step.good .k{color:var(--ok)}
body.hide-process .turn{display:none}
.apr{border:1px solid var(--warn);border-radius:16px;padding:12px;background:var(--card);margin:0 0 8px}
.apr.danger{border:2px solid var(--bad)}
.apr .warnhead{color:var(--bad);font-size:17px;display:block;margin-bottom:4px}
.apr pre.cmd{background:var(--code);color:var(--text);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;font:14px ui-monospace,Menlo,monospace;margin:8px 0}
/* plan: calendar and alarms */
#planSeg{margin:0 18px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:12px;color:var(--mute);padding:2px 0 4px}
.cal button{border:0;background:none;border-radius:12px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0;touch-action:pan-y}
.cal button.out{color:var(--mute);opacity:.5}
.cal button.today{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.sel{background:var(--ink);color:var(--on-ink)}
.cal .dots{display:flex;gap:3px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.monthbar{display:flex;align-items:center;gap:4px;margin:-6px -8px 4px}
.monthbar h3{flex:1;text-align:center}
.card.alarm{display:flex;align-items:center;gap:12px;cursor:pointer}
.card.alarm .grow{flex:1;min-width:0}
.card.alarm .tm{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.card.alarm.off .tm,.card.alarm.off .sub{opacity:.45}
.card.ringing{border:2px solid var(--bad)}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.quick .pill{white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2[hidden]{display:none}
textarea.note{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
input.bigtime{font-size:48px;font-weight:600;background:none;border:0;text-align:center;width:100%;font-variant-numeric:tabular-nums}
.pill.ic{display:inline-flex;align-items:center;gap:6px}
.pill.big-btn{flex:1;padding:13px 16px;font-weight:600}
.daypick{display:flex;gap:4px;flex-wrap:wrap}.daypick button{min-width:38px}.daypick button.on{background:var(--ink);color:var(--on-ink)}
.apr pre{background:var(--code);border-radius:8px;padding:8px;overflow:auto;margin:8px 0;font-size:12px}
#cards{padding:0 18px}
#net{margin:0 18px 8px;padding:8px 14px;border-radius:14px;background:var(--field);color:var(--mute);font-size:13px;display:flex;align-items:center;gap:8px}#net[hidden]{display:none}
#net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
#shareCard .t{margin:6px 0 10px;white-space:pre-wrap;max-height:4.2em;overflow:hidden;font-size:14px}
#composer{padding:6px 16px calc(10px)}
#f{display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 8px;box-shadow:var(--shadow)}
#f:focus-within{border-color:var(--ink)}
#msg{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;padding:9px 4px;line-height:1.4}
.round{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none;color:var(--mute)}#cam[hidden]{display:none}
#send{background:var(--ink);color:var(--on-ink)}
#send.stop{background:var(--bad);color:#fff}
/* settings */
.setrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:15px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
html[data-resolved=dark] .setrow{border:1px solid var(--line)}
.setrow .grow{flex:1;min-width:0}.setrow b{display:block;font-weight:600}.setrow small{color:var(--mute);font-size:14px}
#searchbar{padding:0 18px 8px}
#searchbar input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
/* sub pages */
#subpage{position:absolute;inset:var(--sat,0px) var(--sar,0px) var(--sab,0px) var(--sal,0px);background:var(--page);display:flex;flex-direction:column;z-index:5;transform:none}
#subpage[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){#subpage:not([hidden]){animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}}}
#subhead{display:flex;align-items:center;gap:6px;padding:14px 12px 6px}
#subhead h2{margin:0;font-size:26px;letter-spacing:-.02em}
#subBody{flex:1;overflow:auto;padding:6px 18px 24px}
.sect{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 4px 8px}
.field{display:block;margin:0 0 12px}
.field span{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tog:first-child{border-top:0}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);margin:0;cursor:pointer;transition:background .15s}
.switch input:checked{background:var(--ink)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);pointer-events:none;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:has(input:checked)::after{transform:translateX(20px)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--field);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.tag button{border:0;background:none;padding:0 6px;color:var(--mute)}
.setupbar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:10px}.setupbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--field);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%}.bar.hi i{background:var(--ok)}.bar.med i{background:var(--warn)}.bar.lo i{background:var(--bad)}
.fold{margin:6px 0 6px 10px;border-left:2px solid var(--line);padding-left:8px}
.fold>summary{cursor:pointer;padding:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mem{background:var(--field);border-radius:14px;padding:10px 12px;margin:6px 0}
.mem .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.mem .macts{display:flex;gap:8px;align-items:center;margin-top:6px}
.mem select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;max-width:60%}
.secret{background:var(--field);border:1px dashed var(--ink);border-radius:12px;padding:10px;word-break:break-all;font:13px ui-monospace,Menlo,monospace}
#connect{position:absolute;overflow:auto;inset:var(--sat,0px) var(--sar,0px) var(--sab,0px) var(--sal,0px);z-index:9;background:var(--page);display:flex;flex-direction:column;justify-content:flex-start;padding:28px}
#connect[hidden]{display:none}
#connect h1{font-size:34px;margin:0 0 6px;letter-spacing:-.02em}
#connect .cx-main{margin:auto 0;width:100%;max-width:440px;align-self:center}
#connect.cx-leave{animation:cxleave .48s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes cxleave{to{opacity:0;transform:scale(1.03)}}
#views.app-enter{animation:appin .6s .12s cubic-bezier(.2,0,0,1) both}
@keyframes appin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
#splash{position:absolute;inset:0;z-index:12;background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1)}
#splash.out>*{opacity:0;transform:translateY(-10px) scale(.97);transition:opacity .4s cubic-bezier(.4,0,.2,1),transform .4s cubic-bezier(.4,0,.2,1)}
#splash.out{pointer-events:none}
#splash .sp-logo{animation:sppop .6s cubic-bezier(.2,0,0,1) both;margin:0 0 28px}
#splash .sp-ring{stroke-dasharray:130;stroke-dashoffset:130;animation:cxdraw .8s .35s cubic-bezier(.4,0,.2,1) forwards}
#splash .sp-dot{transform-origin:33.2px 42px;transform:scale(0);animation:spdot .4s 1.05s cubic-bezier(.3,1.6,.5,1) forwards}
#splash .sp-hi{margin:0;color:var(--mute);font-size:17px;animation:spup .6s 1.1s cubic-bezier(.2,0,0,1) both}
#splash .sp-name{margin:2px 0 0;font-size:40px;letter-spacing:-.03em;animation:spup .6s 1.25s cubic-bezier(.2,0,0,1) both}
@keyframes sppop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes spdot{to{transform:scale(1)}}
@keyframes spup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *,#splash,#views.app-enter,#connect.cx-leave{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* first-run motion: step bar, slide-in pages, top progress bar, button spinners, shake, pop, check */
#connect .cx-steps{display:flex;gap:6px;margin:0 0 26px}
#connect .cx-steps i{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
#connect .cx-steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.2,0,0,1)}
#connect .cx-steps i.on::after{transform:scaleX(1)}
#connect .cx-in>*{animation:cxin .45s cubic-bezier(.2,0,0,1) both}
#connect .cx-in>*:nth-child(2){animation-delay:.03s}#connect .cx-in>*:nth-child(3){animation-delay:.06s}#connect .cx-in>*:nth-child(4){animation-delay:.09s}
#connect .cx-in>*:nth-child(5){animation-delay:.12s}#connect .cx-in>*:nth-child(6){animation-delay:.15s}#connect .cx-in>*:nth-child(n+7){animation-delay:.18s}
@keyframes cxin{from{opacity:0;transform:translateX(var(--cx-dx,28px))}to{opacity:1;transform:none}}
#connect .cx-bar{position:fixed;top:var(--sat,0px);left:0;right:0;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;z-index:2;pointer-events:none}
#connect.busy .cx-bar{opacity:1}
#connect .cx-bar::before{content:"";position:absolute;top:0;bottom:0;background:var(--ink);border-radius:2px;animation:cxbar 1.2s cubic-bezier(.4,0,.2,1) infinite}
