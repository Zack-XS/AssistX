[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local backend that turns a language model into a personal assistant. No UI."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-core"
path = "src/main.rs"

# Exact pins (AGENTS.md rule 6). Why each crate:
[dependencies]
axum = "=0.8.9"                                    # HTTP + SSE (docs/00 tech stack)
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }  # async runtime (00)
futures-util = "=0.3.34"                           # stream helpers for SSE
rusqlite = { version = "=0.42.0", features = ["bundled-sqlcipher"] }  # SQLite store (00, 05 #2), encrypted with SQLCipher (CommonCrypto on macOS, system OpenSSL on Linux)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"                             # plugin.yaml (03). Crate is archived; swap when a maintained fork settles
sha2 = "=0.11.1"                                   # token hashes, approval call hashes
ureq = "=3.5.1"                                    # blocking HTTP for model adapter and web/weather plugins
argon2 = "=0.5.3"                                    # Argon2id: turns a passphrase into the key that unlocks an account (docs/15)
tower = { version = "=0.5.3", default-features = false, features = ["util"] }  # hand a request to one account's router (src/hub_http.rs); already inside axum
chacha20poly1305 = "=0.10.1"                          # authenticated encryption for the wrapped account keys (docs/15)

# `node/` is the small program a computer runs to connect to this server (docs/11).
[workspace]
members = [".", "node"]
