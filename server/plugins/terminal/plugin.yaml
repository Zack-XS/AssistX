id: terminal
version: 0.3.0
requires_core: ">=0.1"
summary: Run commands in the user's work folder - allowlisted programs, or any command line after a warned yes.
needs:
  network: []
  secrets: []
  paths: [$AGENT_TERM_CWD]   # working folder; the sandbox allows nothing else
tools:
  - name: allowed
    tags: [reads]
    autonomy: auto
  - name: run
    tags: [writes]   # a command can change files, so never `auto` by default
    autonomy: ask
  - name: shell
    tags: [writes, deletes, unrestricted]   # any command: always a yes with a loud warning; no setting turns that off
    autonomy: ask
runtime:
  builtin: rust   # src/plugins/terminal.rs
