<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AssistX · Server admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<style>
/* The server's admin dashboard (docs/architecture/accounts.md, Admin dashboard). Served by the server at /admin.
   Two locks: the Server Access Code, then the admin login. Both are kept only in this page's memory. */
:root{--page:#f6f6f5;--card:#fff;--raised:#fff;--line:#e7e7e5;--line2:#efefed;--text:#0b0b0b;--mute:#6b6b69;--faint:#9a9a97;--ink:#0b0b0b;--on-ink:#fff;--field:#f3f3f1;--hover:#f6f6f4;
  --ok:#157a42;--ok-bg:#e8f4ec;--warn:#8a5d00;--warn-bg:#fbf1dc;--bad:#b8291f;--bad-bg:#fbe9e7;--shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line);--pop:0 24px 64px rgba(0,0,0,.16),0 0 0 1px var(--line);
  --ease:cubic-bezier(.2,0,0,1);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--page:#0a0a0a;--card:#121212;--raised:#181818;--line:#262626;--line2:#1d1d1d;--text:#ededed;--mute:#9a9a9a;--faint:#6d6d6d;--ink:#ededed;--on-ink:#0a0a0a;--field:#1b1b1b;--hover:#171717;
  --ok:#45c27a;--ok-bg:#12261a;--warn:#e2a826;--warn-bg:#2a210c;--bad:#ff6b63;--bad-bg:#2c1513;--shadow:0 0 0 1px var(--line);--pop:0 24px 64px rgba(0,0,0,.6),0 0 0 1px var(--line)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:var(--text)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.mute{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;transition:background .15s,border-color .15s,transform .1s;position:relative;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad)}.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--hover)}
.btn.wide{width:100%;height:42px}
.btn:disabled{opacity:.5;cursor:default}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--text);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.primary.loading::after{border-color:var(--on-ink);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
.field>small{display:block;color:var(--mute);font-size:12.5px;margin-top:6px}
.input{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent);background:var(--card)}
.input.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em;margin:8px 0 0}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* sign-in */
.auth{min-height:100%;display:grid;place-items:center;padding:32px 20px}
.auth-card{width:100%;max-width:400px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:32px 28px 26px;animation:rise .5s var(--ease) both}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:15px;letter-spacing:-.01em}.brand span{color:var(--mute);font-size:13px}
.steps{display:flex;gap:6px;margin:26px 0 22px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.steps i.on::after{transform:scaleX(1)}
.auth h1{font-size:24px;margin:0 0 6px}
.auth p.lead{color:var(--mute);margin:0 0 22px;font-size:14px}
.auth .back{margin-top:14px;font-size:13.5px;color:var(--mute)}
.auth .back:hover{color:var(--text)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide{animation:slide .4s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.side .brand{padding:4px 8px 18px}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;font-size:14px;text-align:left;width:100%;transition:background .15s,color .15s}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current=page]{background:var(--field);color:var(--text)}
.nav svg{flex:none}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
.side .me{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side .me .who{flex:1;min-width:0}.side .me .who b{display:block;font-size:13.5px}.side .me .who span{font-size:12px;color:var(--mute)}
.main{min-width:0;padding:28px 36px 64px}
.top{display:flex;align-items:center;gap:12px;margin:0 0 24px}
.top h1{font-size:26px;flex:1}
.view{animation:fade .35s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobilebar{display:none}

/* cards, stats */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:15px;flex:1}
.card-b{padding:4px 18px 16px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 14px}
.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.stat .s{font-size:12.5px;color:var(--faint);margin-top:2px}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin:0 2px 18px}
.meta b{color:var(--text);font-weight:500}

/* status pills, avatars */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--field);color:var(--mute);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--warn-bg);color:var(--warn)}.pill.off{background:var(--bad-bg);color:var(--bad)}
.av{width:32px;height:32px;border-radius:9px;background:var(--field);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:var(--mute)}
.av.big{width:44px;height:44px;border-radius:12px;font-size:17px}

/* toolbar and table */
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{height:36px;padding-left:34px}
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.seg button .n{color:var(--faint);margin-left:4px;font-weight:400}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--faint);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover{background:var(--hover)}
tr.row:last-child td{border-bottom:0}
tr.row.fresh{animation:flash 1.6s var(--ease)}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 14%,transparent)}}
.user{display:flex;align-items:center;gap:10px}.user b{font-weight:500}
.chev{color:var(--faint);text-align:right}
.empty{padding:36px 16px;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* activity */
.act{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.act+.act{border-top:1px solid var(--line2)}
.act .dot{width:28px;height:28px;border-radius:8px;background:var(--field);display:grid;place-items:center;flex:none;color:var(--mute)}
.act .txt{flex:1;min-width:0;font-size:14px}.act .txt b{font-weight:500}
.act time{font-size:12.5px;color:var(--faint);white-space:nowrap}
.day{font-size:12px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 4px}
.day:first-child{margin-top:4px}

/* attention list */
.att{display:flex;align-items:center;gap:12px;padding:10px 0}
.att+.att{border-top:1px solid var(--line2)}
.att .txt{flex:1;min-width:0;font-size:14px}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--raised);box-shadow:var(--pop);z-index:21;transform:translateX(100%);transition:transform .32s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer .dh .t{flex:1;min-width:0}.drawer .dh h2{font-size:18px}
.drawer .db{padding:18px 22px;overflow:auto;flex:1}
.drawer .sec{margin:0 0 22px}
.drawer .sec h3{font-size:12px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line2)}
.kv span{color:var(--mute)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone{display:flex;align-items:center;gap:12px;padding:10px 0}
.phone+.phone{border-top:1px solid var(--line2)}
.phone .t{flex:1;min-width:0}.phone .t b{font-weight:500;display:block;font-size:14px}.phone .t span{font-size:12.5px;color:var(--mute)}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));border-radius:12px;padding:14px}
.danger-zone p{margin:0 0 10px;font-size:13px;color:var(--mute)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:20px;pointer-events:none}
.modal .box{pointer-events:auto;width:100%;max-width:420px;background:var(--raised);border-radius:18px;box-shadow:var(--pop);padding:24px;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .22s,transform .28s var(--ease)}
.modal.on .box{opacity:1;transform:none}
.modal h2{font-size:18px;margin:0 0 6px}
.modal p{color:var(--mute);font-size:14px;margin:0 0 18px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.code{font:600 26px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-align:center;padding:18px;border-radius:12px;background:var(--field);user-select:all;margin:4px 0 6px;animation:rise .4s var(--ease) both}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--ink);color:var(--on-ink);padding:11px 14px;border-radius:11px;font-size:14px;box-shadow:var(--pop);display:flex;align-items:center;gap:10px;animation:toast .3s var(--ease) both;max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
.toast.out{animation:toastout .25s var(--ease) forwards}
@keyframes toast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}

/* loading */
.sk{background:linear-gradient(90deg,var(--field) 0%,var(--hover) 50%,var(--field) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.bar{position:fixed;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.bar.on{opacity:1}
.bar::before{content:"";position:absolute;top:0;bottom:0;background:var(--ink);animation:bar 1.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bar{0%{left:-35%;width:30%}60%{left:55%;width:45%}100%{left:105%;width:30%}}

/* settings */
.narrow{max-width:520px}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex;position:sticky;top:0;z-index:10;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .mobilebar .brand{flex:1}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabs .nav{flex-direction:column;height:auto;gap:2px;padding:6px 0;font-size:11px;justify-content:center}
  .tabs .nav .count{display:none}
  .main{padding:20px 16px 96px}
  .top h1{font-size:22px}
  .hide-m{display:none}
  td,th{padding:11px 12px}
  .toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}
}
@media (min-width:761px){.tabs{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- modals ---------- */
function modal(kids, onClose) {

  const esc = e => { if (e.key === "Escape") close(); };
